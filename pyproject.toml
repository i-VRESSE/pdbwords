[project]
name = "pdbwords-maintenance"
version = "0.1.0"
description = "Maintenance scripts for the pdbwords JavaScript application"
requires-python = ">=3.11,<3.14"
dependencies = ["pillow>=11.0", "pymol-open-source==3.2.0a0"]

[project.optional-dependencies]
vision = ["torch>=2.14.1", "torchvision>=0.29.1", "transformers>=5.19.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.uv]
package = false

[tool.ruff]
src = ["scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
